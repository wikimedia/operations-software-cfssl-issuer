apiVersion: v1
kind: Namespace
metadata:
  name: simple-cfssl
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-cfssl
  namespace: simple-cfssl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simple-cfssl
  template:
    metadata:
      labels:
        app: simple-cfssl
    spec:
      containers:
        - name: simple-cfssl
          image: simple-cfssl:latest
          # It's important to set imagePullPolicy as the :latest tag implies imagePullPolicy: Always
          # which will not work with local images.
          imagePullPolicy: Never
          ports:
            - containerPort: 8888
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: simple-cfssl
spec:
  selector:
    app: simple-cfssl
  type: NodePort
  ports:
    - protocol: TCP
      port: 30888
      targetPort: 8888
      nodePort: 30888
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: simple-cfssl
  namespace: simple-cfssl
spec:
  ingress:
  - ports:
    - port: 8888
      protocol: TCP
  podSelector:
    matchLabels:
      app: simple-cfssl
  policyTypes:
  - Ingress
